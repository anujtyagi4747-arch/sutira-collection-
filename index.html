<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sutira Collection | Indian Sarees</title>

<meta name="description" content="Sutira Collection - Elegant Indian sarees crafted for timeless style.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================
   SUTIRA COLLECTION
   PART 1 / 10
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#f8f5ef;
    color:#171513;
    font-family:'DM Sans',sans-serif;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font-family:inherit;
}

/* =========================================
   ANNOUNCEMENT BAR
========================================= */

.sutira-announcement{
    width:100%;
    background:#1b1916;
    color:#fff;
    text-align:center;
    padding:10px 15px;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

/* =========================================
   HEADER
========================================= */

.sutira-header{
    width:100%;
    background:#f8f5ef;
    border-bottom:1px solid #e5dfd5;
    position:sticky;
    top:0;
    z-index:9999;
}

.sutira-nav{
    max-width:1400px;
    height:82px;
    margin:auto;
    padding:0 30px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

/* =========================================
   LOGO
========================================= */

.sutira-logo{
    display:flex;
    flex-direction:column;
    align-items:center;
    line-height:1;
    min-width:170px;
}

.sutira-logo-main{
    font-family:'Playfair Display',serif;
    font-size:29px;
    font-weight:600;
    letter-spacing:2px;
}

.sutira-logo-sub{
    margin-top:7px;
    font-size:8px;
    letter-spacing:5px;
    font-weight:600;
    color:#746b61;
}

/* =========================================
   DESKTOP MENU
========================================= */

.sutira-menu{
    display:flex;
    align-items:center;
    gap:32px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.8px;
}

.sutira-menu a{
    position:relative;
    padding:8px 0;
}

.sutira-menu a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:2px;
    width:0;
    height:1px;
    background:#171513;
    transition:.3s;
}

.sutira-menu a:hover::after{
    width:100%;
}

/* =========================================
   HEADER ICONS
========================================= */

.sutira-actions{
    display:flex;
    align-items:center;
    gap:17px;
}

.sutira-icon{
    width:21px;
    height:21px;
    cursor:pointer;
    transition:.25s;
}

.sutira-icon:hover{
    transform:translateY(-1px);
    opacity:.6;
}

.sutira-cart{
    position:relative;
}

.sutira-cart-count{
    position:absolute;
    top:-7px;
    right:-8px;

    min-width:16px;
    height:16px;

    padding:0 4px;
    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#1b1916;
    color:#fff;

    font-size:9px;
    font-weight:700;
}

/* =========================================
   MOBILE MENU BUTTON
========================================= */

.sutira-mobile-btn{
    display:none;
    border:0;
    background:none;
    font-size:25px;
    cursor:pointer;
    padding:4px;
}

/* =========================================
   MOBILE MENU
========================================= */

.sutira-mobile-menu{
    display:none;
    background:#f8f5ef;
    border-top:1px solid #e5dfd5;
    padding:20px;
}

.sutira-mobile-menu a{
    display:block;
    padding:13px 0;
    border-bottom:1px solid #e8e2d9;

    font-size:13px;
    letter-spacing:1px;
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:900px){

    .sutira-nav{
        height:70px;
        padding:0 17px;
    }

    .sutira-mobile-btn{
        display:block;
    }

    .sutira-menu{
        display:none;
    }

    .sutira-logo{
        min-width:auto;
    }

    .sutira-logo-main{
        font-size:23px;
        letter-spacing:1.5px;
    }

    .sutira-logo-sub{
        font-size:7px;
        letter-spacing:3.5px;
        margin-top:6px;
    }

    .sutira-actions{
        gap:11px;
    }

    .sutira-icon{
        width:19px;
        height:19px;
    }
}

@media(max-width:480px){

    .sutira-announcement{
        font-size:9px;
        letter-spacing:1px;
        padding:9px 8px;
    }

    .sutira-nav{
        padding:0 13px;
    }

    .sutira-logo-main{
        font-size:21px;
    }

    .sutira-logo-sub{
        font-size:6px;
    }
}

</style>

</head>

<body>

<!-- =========================================
     ANNOUNCEMENT BAR
========================================= -->

<div class="sutira-announcement">
    ✦ Free Shipping on Prepaid Orders ✦
</div>


<!-- =========================================
     HEADER
========================================= -->

<header class="sutira-header">

    <nav class="sutira-nav">

        <!-- MOBILE BUTTON -->

        <button
            class="sutira-mobile-btn"
            onclick="sutiraToggleMenu()"
            aria-label="Open Menu">
            ☰
        </button>


        <!-- BRAND LOGO -->

        <a href="#home" class="sutira-logo">

            <span class="sutira-logo-main">
                SUTIRA
            </span>

            <span class="sutira-logo-sub">
                COLLECTION
            </span>

        </a>


        <!-- DESKTOP NAVIGATION -->

        <div class="sutira-menu">

            <a href="#home">HOME</a>

            <a href="#shop">SHOP</a>

            <a href="#collections">COLLECTIONS</a>

            <a href="#about">ABOUT</a>

            <a href="#contact">CONTACT</a>

        </div>


        <!-- HEADER ACTIONS -->

        <div class="sutira-actions">

            <!-- SEARCH -->

            <svg
                class="sutira-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6">

                <circle cx="11" cy="11" r="7"></circle>

                <path d="M20 20l-4-4"></path>

            </svg>


            <!-- ACCOUNT -->

            <svg
                class="sutira-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6">

                <circle cx="12" cy="8" r="3.5"></circle>

                <path d="M5 21c.8-4 3-6 7-6s6.2 2 7 6"></path>

            </svg>


            <!-- CART -->

            <div class="sutira-cart">

                <svg
                    class="sutira-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6">

                    <path d="M5 8h14l1 13H4L5 8z"></path>

                    <path d="M9 8a3 3 0 0 1 6 0"></path>

                </svg>

                <span class="sutira-cart-count">0</span>

            </div>

        </div>

    </nav>


    <!-- MOBILE NAVIGATION -->

    <div class="sutira-mobile-menu" id="sutiraMobileMenu">

        <a href="#home" onclick="sutiraToggleMenu()">HOME</a>

        <a href="#shop" onclick="sutiraToggleMenu()">SHOP</a>

        <a href="#collections" onclick="sutiraToggleMenu()">COLLECTIONS</a>

        <a href="#about" onclick="sutiraToggleMenu()">ABOUT</a>

        <a href="#contact" onclick="sutiraToggleMenu()">CONTACT</a>

    </div>

</header>


<!-- =========================================
     PART 2 WILL BE PASTED BELOW THIS LINE
========================================= -->


<script>

function sutiraToggleMenu(){

    const menu =
        document.getElementById("sutiraMobileMenu");

    if(menu.style.display === "block"){

        menu.style.display = "none";

    }else{

        menu.style.display = "block";

    }

}

</script>

</body>
</html>
